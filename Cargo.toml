[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/ocr", "crates/ai", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bluesnap-core = { path = "crates/core" }
bluesnap-platform = { path = "crates/platform" }
bluesnap-ocr = { path = "crates/ocr" }
bluesnap-ai = { path = "crates/ai" }
anyhow = "1"
log = "0.4"
raw-window-handle = "0.6"

# Pixel-heavy code (capture conversion, rasterizing annotations) is painfully
# slow unoptimized, so optimize it even in dev builds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
[profile.dev.package.bluesnap-core]
opt-level = 2
[profile.dev.package.bluesnap-platform]
opt-level = 2
# Neural network inference is unusably slow without optimizations.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.pure-onnx-ocr]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# gpui 0.2.2 pulls in xattr 0.2.3, which no longer builds on Linux against
# current libc (`ENOATTR` was removed there). Only affects Linux builds.
[patch.crates-io]
xattr = { path = "third_party/xattr" }

# GPUI 0.2.2 with per-window Direct3D atlas region updates for annotation layers.
gpui = { path = "third_party/gpui" }
