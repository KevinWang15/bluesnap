name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: target/release/bluesnap.exe
          - name: macos-arm64
            os: macos-latest
            artifact: target/release/bluesnap-macos.zip
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gpui compiles its HLSL shaders with fxc.exe in release builds; its built-in
      # lookup only knows one SDK version, so point it at whatever the runner has.
      - name: Locate fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "fxc.exe not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      # gpui compiles its Metal shaders at build time. Newer Xcode versions ship the
      # Metal toolchain as a separate download.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p bluesnap

      # macOS only honors the Screen Recording permission for apps signed with a
      # real identity. Set the MACOS_CERTIFICATE_P12 (base64 .p12),
      # MACOS_CERTIFICATE_PASSWORD and MACOS_SIGNING_IDENTITY secrets to sign;
      # without them the bundle is ad-hoc signed.
      - name: Bundle and sign macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=target/release/bluesnap.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/bluesnap "$app/Contents/MacOS/"
          cp packaging/macos/Info.plist "$app/Contents/"
          cp packaging/macos/AppIcon.icns "$app/Contents/Resources/"
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(uuidgen)"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          else
            echo "::warning::No signing certificate configured; ad-hoc signing. macOS will not grant Screen Recording to this build."
            codesign --force --sign - "$app"
          fi
          codesign --verify --verbose "$app"
          ditto -c -k --keepParent "$app" target/release/bluesnap-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bluesnap-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
