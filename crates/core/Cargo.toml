[package]
name = "bluesnap-core"
description = "Platform-independent screenshot editing model and rasterizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2"
# Font files are mapped rather than read: see `text::mapped`.
memmap2 = "0.9"
png = "0.18"
tiny-skia = "0.12"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "editor"
harness = false
