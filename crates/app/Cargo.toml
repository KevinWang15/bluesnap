[package]
name = "bluesnap"
description = "Fast screenshot tool with window picking and annotations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bluesnap-core.workspace = true
bluesnap-platform.workspace = true
bluesnap-ai.workspace = true
anyhow.workspace = true
log.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
clipboard-rs = "0.3.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
env_logger = "0.11"
futures = "0.3"
global-hotkey = "0.10"
gpui = { git = "https://github.com/KevinWang15/gpui", rev = "ed4a2cce949c3dd4ce626e3469000fd625a1eb01" }
gpui_platform = { git = "https://github.com/KevinWang15/gpui", rev = "ed4a2cce949c3dd4ce626e3469000fd625a1eb01", features = ["font-kit", "x11", "wayland"] }
# Same major version gpui uses for `RenderImage` frames.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }

[build-dependencies]
embed-resource = "3"
