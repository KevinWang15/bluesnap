[package]
name = "bluesnap"
description = "Fast screenshot tool with window picking and annotations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bluesnap-core.workspace = true
bluesnap-platform.workspace = true
anyhow.workspace = true
log.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
env_logger = "0.11"
futures = "0.3"
global-hotkey = "0.10"
gpui = "0.2.2"
# Same major version gpui uses for `RenderImage` frames.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
