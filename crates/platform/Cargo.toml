[package]
name = "bluesnap-platform"
description = "OS integration for bluesnap: screen capture, window enumeration, overlay window setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
raw-window-handle.workspace = true

# macOS uses the Vision framework instead, so the ~31 MB of models stay out of its build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
bluesnap-ocr.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSString",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSPanel",
    "NSGraphics",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGGeometry",
    "CGImage",
    "CGWindow",
] }
