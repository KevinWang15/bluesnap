[package]
name = "bluesnap-ocr"
description = "Embedded PP-OCRv6 text recognition, for platforms without a built-in OCR engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
geo-types = "0.7"
image = { version = "0.25", default-features = false }
ndarray = "0.17"
pure-onnx-ocr = "0.3.2"
rayon = "1"
tract-linalg = "0.23"
tract-onnx = "0.23"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "recognize"
harness = false
